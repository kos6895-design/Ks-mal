name: Deploy MALINA Bar to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker-direct.js'
      - 'wrangler.json'
      - '.github/workflows/deploy-cloudflare.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker
        run: node --check worker-direct.js
      # Deploy through wrangler.json so the D1 binding is retained.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 732eca868669abfd15b245df62cf7573
          command: deploy --config wrangler.json
      # Deployment marker: cost filter and clearer opening cash UI.
