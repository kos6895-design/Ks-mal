name: Deploy MALINA Bar to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker-direct.js'
      - 'wrangler.json'
      - '.github/workflows/deploy-cloudflare.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm expenses UI is in both admin menus
        run: |
          test "$(grep -o 'view=calcexpenses' worker-direct.js | wc -l)" -ge 2
          grep -q 'MALINA UI 2026-11-03 EXPENSES' worker-direct.js
          echo "Confirmed current main contains expenses UI for both admin roles"
      - name: Validate Worker
        run: node --check worker-direct.js
      - name: Deploy current main Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 732eca868669abfd15b245df62cf7573
          command: deploy --config wrangler.json
      # Deployment marker: fixed full-admin expenses navigation.
